server:
  port: 8080

spring:
  application:
    name: dati-backend
  datasource:
    url: jdbc:mysql://localhost:3306/dati?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: password
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt-secret: "change-this-secret-to-a-long-random-production-value"
  jwt-expire-hours: 720
  product:
    full-access-amount: 9900
  wechat:
    app-id: ""
    app-secret: ""
    mch-id: ""
    api-v3-key: ""
    notify-url: ""
    dev-mode: true
