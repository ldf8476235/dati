<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>练习页面 - 我爱刷题</title>

        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "surface": "#faf8ff",
                        "secondary-fixed": "#e0e3e6",

                        "on-secondary": "#ffffff",

                        "secondary-container": "#e0e3e6",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#773200",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2f3037",

                        "on-secondary-container": "#626567",
                        "on-primary-fixed": "#001849",
                        "surface-tint": "#2b58bd",
                        "outline-variant": "#c3c6d5",
                        "surface-container-highest": "#e2e2eb",
                        "background": "#faf8ff",
                        "on-tertiary-fixed": "#331200",
                        "on-secondary-fixed": "#191c1e",
                        "on-background": "#1a1b22",
                        "inverse-primary": "#b3c5ff",
                        "surface-container": "#ededf6",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e2eb",
                        "surface-container-high": "#e8e7f0",
                        "tertiary-container": "#9c4400",
                        "inverse-on-surface": "#f0f0f9",
                        "tertiary-fixed-dim": "#ffb68f",
                        "on-tertiary-fixed-variant": "#773200",
                        "primary-fixed-dim": "#b3c5ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#faf8ff",
                        "on-error": "#ffffff",
                        "primary": "#003fa3",
                        "primary-fixed": "#dae1ff",
                        "surface-container-low": "#f3f3fc",
                        "on-primary-container": "#ccd7ff",
                        "on-secondary-fixed-variant": "#44474a",
                        "on-surface": "#1a1b22",
                        "on-tertiary-container": "#ffceb5",
                        "secondary": "#5b5f61",
                        "outline": "#747684",
                        "tertiary-fixed": "#ffdbca",
                        "surface-dim": "#d9d9e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap": "12px",
                        "section-padding": "20px",
                        "item-padding": "16px",
                        "container-margin": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "title-lg": ["18px", { "lineHeight": "26px", "fontWeight": "600" }],
                        "display-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background text-primary dark:text-primary-fixed-dim font-headline-md text-headline-md font-bold docked full-width top-0 bg-surface dark:bg-background shadow-sm shadow-sm dark:shadow-none fixed top-0 left-0 w-full z-50 flex items-center justify-between px-4 h-14">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-on-surface-variant dark:text-outline" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md tracking-tight">顺序练习</h1>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-on-surface-variant dark:text-outline" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-[72px] pb-[100px] px-container-margin overflow-y-auto">
<!-- Progress Indicator & Category Chip -->
<div class="flex items-center justify-between mb-section-padding">
<div class="flex items-center gap-2">
<span class="bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm px-2 py-1 rounded-DEFAULT border border-outline-variant">职业道德</span>
<span class="bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm px-2 py-1 rounded-DEFAULT border border-outline-variant">单选题</span>
</div>
<div class="font-body-md text-body-md text-secondary">
<span class="text-primary font-semibold">12</span> / 200
            </div>
</div>
<!-- Progress Bar -->
<div class="w-full bg-secondary-container rounded-full h-1.5 mb-section-padding">
<div class="bg-primary h-1.5 rounded-full" style="width: 6%;"></div>
</div>
<!-- Question Card -->
<div class="bg-surface-container-lowest rounded-lg p-item-padding shadow-[0px_2px_8px_rgba(43,88,189,0.05)] mb-section-padding">
<p class="font-title-lg text-title-lg text-on-surface mb-4 leading-relaxed">
                12. 长护师在服务过程中，若发现服务对象出现突发性生命危险，以下哪项处理方式最为恰当？
            </p>
<!-- Options List -->
<div class="flex flex-col gap-stack-gap">
<!-- Option A: Default State -->
<button class="w-full flex items-start p-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-left hover:bg-surface-container-low transition-colors duration-200">
<span class="flex-shrink-0 w-6 h-6 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant font-body-md mr-3 mt-0.5">A</span>
<span class="font-body-lg text-body-lg text-on-surface">立即停止当前操作，拨打急救电话并通知家属。</span>
</button>
<!-- Option B: Incorrect State (Simulated) -->
<button class="w-full flex items-start p-3 bg-error-container border border-error rounded-lg text-left transition-colors duration-200">
<span class="flex-shrink-0 w-6 h-6 rounded-full bg-error text-on-error flex items-center justify-center font-body-md mr-3 mt-0.5">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</span>
<span class="font-body-lg text-body-lg text-on-error-container">自行进行心肺复苏，不通知任何人以免引起恐慌。</span>
</button>
<!-- Option C: Correct State (Simulated) -->
<button class="w-full flex items-start p-3 bg-[#e8f5e9] border border-[#2e7d32] rounded-lg text-left transition-colors duration-200">
<span class="flex-shrink-0 w-6 h-6 rounded-full bg-[#2e7d32] text-white flex items-center justify-center font-body-md mr-3 mt-0.5">
<span class="material-symbols-outlined text-[16px]" data-icon="check">check</span>
</span>
<span class="font-body-lg text-body-lg text-[#1b5e20]">保持冷静，评估生命体征，必要时进行急救并呼叫救援。</span>
</button>
<!-- Option D: Default State -->
<button class="w-full flex items-start p-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-left hover:bg-surface-container-low transition-colors duration-200">
<span class="flex-shrink-0 w-6 h-6 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant font-body-md mr-3 mt-0.5">D</span>
<span class="font-body-lg text-body-lg text-on-surface">迅速离开现场，寻找医生来处理。</span>
</button>
</div>
</div>
<!-- Explanation Card (Visible after answering) -->
<div class="bg-surface-container-low rounded-lg p-item-padding border border-outline-variant shadow-sm">
<div class="flex items-center justify-between border-b border-outline-variant pb-3 mb-3">
<h3 class="font-title-lg text-title-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="lightbulb">lightbulb</span>
                    答案解析
                </h3>
<div class="font-body-md text-body-md">
<span class="text-secondary">正确答案：</span>
<span class="text-[#2e7d32] font-semibold">C</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                在面对服务对象出现突发性生命危险时，长护师的首要任务是保持冷静，迅速评估其生命体征（如呼吸、脉搏）。如果情况危急，应立即在自己能力范围内采取必要的急救措施（如心肺复苏），同时大声呼救或拨打120急救电话，并尽快通知家属。选项A过于绝对，未提及初步急救；选项B错误在于隐瞒情况；选项D属于擅离职守，可能延误最佳抢救时机。
            </p>
<div class="mt-4 flex gap-2 flex-wrap">
<span class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-2 py-1 rounded-DEFAULT">考点：应急处理</span>
<span class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-2 py-1 rounded-DEFAULT">难度：中等</span>
</div>
</div>
</main>
<!-- Bottom Action Bar (Transactional/Task-focused, replaces standard navigation) -->
<div class="fixed bottom-0 left-0 w-full bg-surface dark:bg-background border-t border-outline-variant shadow-[0px_-2px_8px_rgba(43,88,189,0.05)] z-50 flex items-center justify-between px-4 py-3 pb-safe">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline w-16 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined mb-1" data-icon="chevron_left">chevron_left</span>
<span class="font-label-sm text-label-sm">上一题</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim w-16 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined mb-1 fill" data-icon="bookmark" data-weight="fill">bookmark</span>
<span class="font-label-sm text-label-sm">已收藏</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline w-16 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined mb-1" data-icon="chevron_right">chevron_right</span>
<span class="font-label-sm text-label-sm">下一题</span>
</button>
</div>
</body></html>
